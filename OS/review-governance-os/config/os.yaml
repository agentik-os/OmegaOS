name: Review & Governance OS
slug: review-governance
version: 1.0.0
category: Omega Core / Review, Risk and Governance
position: Omega Core: closes learning loops and governs consequential change across all OSs
default_mode: daily
primary_boundary: "Review & Governance OS evaluates and authorizes; it does not own daily execution, rewrite source evidence, or become bureaucracy detached from risk."
