name: Revenue OS
slug: revenue
version: 1.0.0
category: Business Stack / Commercial and Financial Intelligence
position: Business Stack: conversational revenue brain, CRM, offers, sales, billing, AR and business financial control
default_mode: dashboard
primary_boundary: "Revenue OS owns business economics and commercial records; personal savings, personal accounts and personal investments belong to Wealth & Capital OS. It assists accounting but does not replace the legally accountable accountant, tax professional or controller."
requires_human_approval_for:
  - sending sales/collections messages
  - issuing invoices or credits
  - posting accounting entries
  - moving cash or reserves
  - changing price/discount terms
  - closing an opportunity
  - sharing contracts/financial data
  - writing off receivables
