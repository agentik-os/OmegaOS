# OmegaOS default configuration
# Copy to ~/.omega/config.toml and customize

# Directories for state, logs, and locks
state_dir = "~/.omega/state"
logs_dir = "~/.omega/logs"
locks_dir = "~/.omega/locks"

# Agent CLI command (e.g., "claude", "codex", or path to custom agent)
agent_command = "claude"

# Default model for agents
default_model = "opus"

# Project definitions
# [[projects]]
# name = "MyProject"
# path = "/home/user/projects/myproject"
# category = "Work"
# icon = "🚀"

# Quality Arsenal (17 forensic audits)
[audits]
# Which audits to auto-run at end of mission (empty = auto-select based on mission)
auto_audits = []
# Minimum score threshold for audit PASS (0-100)
pass_threshold = 70
# Enable end-of-mission audit hook
end_of_mission_hook = true
# Maximum concurrent audit workers
max_parallel = 4

# Optional Telegram integration
# [telegram]
# bot_token = "YOUR_BOT_TOKEN"
# chat_id = 123456789
