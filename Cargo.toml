[workspace]
members = [
    "crates/omega-core",
    "crates/omega-tui",
    "crates/omega-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentik-os/OmegaOS"

[workspace.dependencies]
omega-core = { path = "crates/omega-core" }
omega-tui = { path = "crates/omega-tui" }

rmux-sdk = { git = "https://github.com/agentik-os/rmux", rev = "726d9e7", features = ["regex"] }
rmux-proto = { git = "https://github.com/agentik-os/rmux", rev = "726d9e7" }
ratatui-rmux = { git = "https://github.com/agentik-os/rmux", rev = "726d9e7" }

tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.29"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0"
toml = "0.8"
clap_complete = "4.5"
thiserror = "1.0"

# Release profile tuned for a shipped single-binary tool: full LTO + one codegen
# unit produce a smaller, faster binary; strip drops debug symbols. panic stays
# "unwind" (default) on purpose — patrol/executor run as long-lived tokio tasks,
# and a single panicking task must not abort the whole orchestrator process.
[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
