[workspace]
members = [
    "crates/omega-core",
    "crates/omega-tui",
    "crates/omega-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentik-os/OmegaOS"

[workspace.dependencies]
omega-core = { path = "crates/omega-core" }
omega-tui = { path = "crates/omega-tui" }

rmux-sdk = { git = "https://github.com/agentik-os/rmux", rev = "6301d12", features = ["regex"] }
rmux-proto = { git = "https://github.com/agentik-os/rmux", rev = "6301d12" }
ratatui-rmux = { git = "https://github.com/agentik-os/rmux", rev = "6301d12" }

tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.29"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Release profile tuned for a shipped single-binary tool: full LTO + a single
# codegen unit produce a smaller, faster binary, and strip drops debug symbols.
# panic stays "unwind" (default) — the orchestration layer must not abort the
# whole process on a worker panic. The extra build time is a one-time install
# cost (install.sh builds from source); runtime speed is what ships.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
dirs = "6.0"
toml = "0.8"
clap_complete = "4.5"
thiserror = "1.0"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
