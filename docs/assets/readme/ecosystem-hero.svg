<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-labelledby="title desc"><title id="title">OmegaOS</title><desc id="desc">Coordinate agents. Keep work observable. Decorative motion, not live telemetry.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.flow{stroke-dasharray:6 10;animation:flow 5s linear infinite}@keyframes flow{to{stroke-dashoffset:-96}}@media(prefers-reduced-motion:reduce){.flow{animation:none}}</style><rect x=".5" y=".5" width="959" height="179" rx="14" fill="#10161c" stroke="#34424e"/><text x="30" y="32" fill="#a5b5c2" font-size="11" letter-spacing="2">AGENTIC TERMINAL SYSTEM</text><text x="28" y="96" fill="#edf3f8" font-size="46" font-weight="700">OmegaOS</text><text x="30" y="137" fill="#a5b5c2" font-size="17">Coordinate agents. Keep work observable.</text><path d="M690 116H738L770 74H926" fill="none" stroke="#34424e" stroke-width="2"/><path class="flow" d="M690 116H738L770 74H926" fill="none" stroke="#c5f277" stroke-width="2"/><text x="926" y="158" text-anchor="end" fill="#a5b5c2" font-size="10" letter-spacing="1.4">AGENTIK ECOSYSTEM</text></svg>