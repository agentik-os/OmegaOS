[package]
name = "omega"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OmegaOS CLI: agentic terminal operating system"

[[bin]]
name = "omega"
path = "src/main.rs"

[dependencies]
omega-core.workspace = true
omega-tui.workspace = true
rmux-sdk.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
ratatui.workspace = true
crossterm.workspace = true
toml.workspace = true
clap_complete.workspace = true
dirs.workspace = true
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
regex = "1"
chrono.workspace = true
# OSC 52 clipboard payload for the TUI mouse-selection (already in the lock).
base64 = "0.22"
