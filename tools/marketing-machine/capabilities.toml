schema = "marketing-machine/capabilities@2026-07"
# ============================================================================
# OmegaOS Marketing Machine — CAPABILITIES REGISTRY (the anti-forgetting SSOT)
# ----------------------------------------------------------------------------
# One [[capability]] block per row of tools/marketing-machine/AUDIT.md §1
# (the ~78-row inventory across 11 groups), plus the growth-doc capabilities
# (carousel system, hook engine, comment-to-DM funnel, series, packaging,
# /watch). This is the machine-readable "everything the machine can do".
#
# Read it with:  omega marketing capabilities [--group <g>] [--json]
# Adding a capability = one [[capability]] block (the anti-forgetting contract).
#
# Field contract (every capability carries):
#   id      — stable id (matches AUDIT §1 where applicable)
#   group   — one of the [[group]] ids below
#   name    — human name
#   does    — one line, what it produces / does
#   run     — the EXACT command / skill / engine invocation
#   kind    — cli | skill | engine | doc | file
#   inputs  — files/artifacts it reads
#   layer   — 00-context | 01-strategy | 02-copy | 03-visual-identity |
#             04-publishing | 05-calendar | 06-branding | cross | n/a
#   status  — built | partial | missing
#   deps    — tools/keys it needs (checked by `omega marketing doctor`)
#   paid    — true if it hits a paid external API
#   skill   — the /omg-* or / skill name, if any
#   notes   — free text
# Legend: built = exists + used live · partial = exists, not wired end-to-end /
#         single-project only · missing = named in spec/plan, not built.
# ============================================================================

# ---------------------------------------------------------------------------
# Groups (the inventory's spine — matches AUDIT §1)
# ---------------------------------------------------------------------------
[[group]]
id = "research-strategy"
name = "Research & Strategy"
order = 1

[[group]]
id = "copy"
name = "Copy"
order = 2

[[group]]
id = "visual-image"
name = "Visual — Image"
order = 3

[[group]]
id = "visual-video"
name = "Visual — Video"
order = 4

[[group]]
id = "voice-audio"
name = "Voice / Audio"
order = 5

[[group]]
id = "ugc-avatar"
name = "UGC / Avatar"
order = 6

[[group]]
id = "branding"
name = "Branding (06-branding SSOT)"
order = 7

[[group]]
id = "calendar"
name = "Calendar / Planning"
order = 8

[[group]]
id = "publishing"
name = "Publishing"
order = 9

[[group]]
id = "growth"
name = "Growth / Playbooks / Outreach"
order = 10

[[group]]
id = "orchestration"
name = "Orchestration / Meta"
order = 11

