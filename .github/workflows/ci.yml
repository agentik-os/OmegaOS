name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build (warnings are errors)
        run: cargo build --release --locked --workspace
        env:
          RUSTFLAGS: "-D warnings"

      - name: Test
        run: cargo test --locked --workspace

      - name: Shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find . -type f -name '*.sh' -not -path './target/*' -print0)

      - name: Workflow graph contracts
        run: bash scripts/check-workflows.sh

      - name: Audit runner contracts
        run: bash scripts/tests/test_audit_runner.sh

      - name: Python contracts
        run: |
          python3 scripts/tests/test_hook_plan_state.py
          python3 scripts/tests/test_skill_catalog_scripts.py
          python3 scripts/tests/test_release_contract.py

      - name: Canonical skill catalog
        run: cargo run --locked --bin omega -- skills validate --root skills

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0

      - name: Installer contracts
        working-directory: installer
        run: npm test
