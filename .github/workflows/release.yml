name: release

# A release is created only from a version tag that exactly matches the
# workspace package version. Every platform artifact is built and attested
# before one serialized publisher exposes the completed draft.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: validate tag + version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require an exact workspace version tag
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          import tomllib
          with open('Cargo.toml', 'rb') as handle:
              print(tomllib.load(handle)['workspace']['package']['version'])
          PY
          )"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_SHA^{commit}")"

  quality:
    name: release quality gate
    needs: metadata
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: build ${{ matrix.target }}
    needs: [metadata, quality]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      # Let every platform report its result, but any failure blocks publish.
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-14,         target: aarch64-apple-darwin }
          - { os: macos-14,         target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config build-essential

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Build omega from the pinned lockfile
        run: cargo build --release --locked --bin omega --target ${{ matrix.target }}

      - name: Resolve the exact locked rmux revision
        id: rmux
        shell: bash
        run: |
          rev="$(python3 - <<'PY'
          import re
          import tomllib
          with open('Cargo.lock', 'rb') as handle:
              packages = tomllib.load(handle)['package']
          revisions = {
              package['source'].rsplit('#', 1)[1]
              for package in packages
              if package['name'] == 'rmux-sdk'
              and package.get('source', '').startswith('git+https://github.com/agentik-os/rmux?')
          }
          if len(revisions) != 1:
              raise SystemExit(f'expected one locked rmux-sdk revision, got {sorted(revisions)}')
          revision = revisions.pop()
          if re.fullmatch(r'[0-9a-f]{40}', revision) is None:
              raise SystemExit(f'invalid locked rmux revision: {revision!r}')
          print(revision)
          PY
          )"
          path="$RUNNER_TEMP/rmux-${{ matrix.target }}"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Build the exact locked rmux revision
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/agentik-os/rmux "${{ steps.rmux.outputs.path }}"
          git -C "${{ steps.rmux.outputs.path }}" checkout --detach "${{ steps.rmux.outputs.rev }}"
          test "$(git -C "${{ steps.rmux.outputs.path }}" rev-parse HEAD)" = "${{ steps.rmux.outputs.rev }}"
          cargo build --release --locked --manifest-path "${{ steps.rmux.outputs.path }}/Cargo.toml" --target "${{ matrix.target }}"

      - name: Package deterministic omega + rmux archive
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/omega" dist/omega
          cp "${{ steps.rmux.outputs.path }}/target/${{ matrix.target }}/release/rmux" dist/rmux
          python3 - "$GITHUB_SHA" "${{ steps.rmux.outputs.rev }}" "${{ matrix.target }}" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          omega_commit, rmux_commit, target = sys.argv[1:]
          lock_digest = hashlib.sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest()
          build_info = {
              'cargo_lock_sha256': lock_digest,
              'omega_commit': omega_commit,
              'rmux_commit': rmux_commit,
              'schema_version': 1,
              'target': target,
          }
          pathlib.Path('dist/BUILD-INFO.json').write_text(
              json.dumps(build_info, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY
          python3 - "${{ matrix.target }}" <<'PY'
          import gzip
          import pathlib
          import sys
          import tarfile
          target = sys.argv[1]
          root = pathlib.Path('dist')
          output = root / f'omega-{target}.tar.gz'
          with output.open('wb') as raw:
              with gzip.GzipFile(filename='', mode='wb', fileobj=raw, mtime=0) as zipped:
                  with tarfile.open(fileobj=zipped, mode='w', format=tarfile.USTAR_FORMAT) as archive:
                      for name in ('omega', 'rmux', 'BUILD-INFO.json'):
                          path = root / name
                          info = archive.gettarinfo(str(path), arcname=name)
                          info.uid = info.gid = 0
                          info.uname = info.gname = ''
                          info.mtime = 0
                          info.mode = 0o755 if name in {'omega', 'rmux'} else 0o644
                          with path.open('rb') as source:
                              archive.addfile(info, source)
          PY
          python3 - "dist/omega-${{ matrix.target }}.tar.gz" <<'PY'
          import hashlib
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          path.with_name(path.name + '.sha256').write_text(
              f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n',
              encoding='utf-8',
          )
          PY

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/omega-${{ matrix.target }}.spdx.json
          artifact-name: omega-${{ matrix.target }}.spdx.json
          syft-version: v1.51.0
          upload-artifact: false
          upload-release-assets: false

      - name: Checksum the SBOM
        shell: bash
        run: |
          python3 - "dist/omega-${{ matrix.target }}.spdx.json" <<'PY'
          import hashlib
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          path.with_name(path.name + '.sha256').write_text(
              f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n',
              encoding='utf-8',
          )
          PY

      - name: Attest archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/omega-${{ matrix.target }}.tar.gz

      - name: Attest archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/omega-${{ matrix.target }}.tar.gz
          sbom-path: dist/omega-${{ matrix.target }}.spdx.json

      - name: Stage immutable release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/omega-${{ matrix.target }}.tar.gz
            dist/omega-${{ matrix.target }}.tar.gz.sha256
            dist/omega-${{ matrix.target }}.spdx.json
            dist/omega-${{ matrix.target }}.spdx.json.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: verify + publish complete release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download every platform artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify checksums, matrix completeness, and build provenance
        shell: bash
        run: |
          python3 - "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys
          import tarfile
          import tomllib
          commit = sys.argv[1]
          root = pathlib.Path('dist')
          targets = {
              'x86_64-unknown-linux-gnu',
              'aarch64-unknown-linux-gnu',
              'aarch64-apple-darwin',
              'x86_64-apple-darwin',
          }
          expected = {
              f'omega-{target}{suffix}'
              for target in targets
              for suffix in ('.tar.gz', '.tar.gz.sha256', '.spdx.json', '.spdx.json.sha256')
          }
          actual = {path.name for path in root.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f'release asset mismatch: missing={sorted(expected - actual)}, extra={sorted(actual - expected)}')
          lock_digest = hashlib.sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest()
          with pathlib.Path('Cargo.lock').open('rb') as handle:
              packages = tomllib.load(handle)['package']
          rmux_revisions = {
              package['source'].rsplit('#', 1)[1]
              for package in packages
              if package['name'] == 'rmux-sdk'
              and package.get('source', '').startswith('git+https://github.com/agentik-os/rmux?')
          }
          if len(rmux_revisions) != 1:
              raise SystemExit(f'expected one locked rmux-sdk revision, got {sorted(rmux_revisions)}')
          locked_rmux = rmux_revisions.pop()
          if re.fullmatch(r'[0-9a-f]{40}', locked_rmux) is None:
              raise SystemExit(f'invalid locked rmux revision: {locked_rmux!r}')
          for target in targets:
              for name in (f'omega-{target}.tar.gz', f'omega-{target}.spdx.json'):
                  path = root / name
                  recorded = (root / f'{name}.sha256').read_text(encoding='utf-8').split()
                  if recorded != [hashlib.sha256(path.read_bytes()).hexdigest(), name]:
                      raise SystemExit(f'checksum mismatch for {name}')
              archive = root / f'omega-{target}.tar.gz'
              with tarfile.open(archive, mode='r:gz') as bundle:
                  if set(bundle.getnames()) != {'omega', 'rmux', 'BUILD-INFO.json'}:
                      raise SystemExit(f'unexpected archive members for {target}: {bundle.getnames()}')
                  build_info = json.load(bundle.extractfile('BUILD-INFO.json'))
              if build_info.get('schema_version') != 1:
                  raise SystemExit(f'invalid build-info schema for {target}')
              if build_info.get('omega_commit') != commit or build_info.get('target') != target:
                  raise SystemExit(f'build provenance mismatch for {target}')
              if build_info.get('cargo_lock_sha256') != lock_digest:
                  raise SystemExit(f'Cargo.lock provenance mismatch for {target}')
              if build_info.get('rmux_commit') != locked_rmux:
                  raise SystemExit(f'rmux provenance mismatch for {target}')
          PY
      - name: Upload assets to a non-public draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: dist/*
      - name: Publish the fully populated draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          make_latest: true
