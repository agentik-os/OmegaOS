name: release

# Cut prebuilt omega + rmux binaries per platform on a version tag, so
# `npx omega-os` / install.sh can DOWNLOAD them instead of compiling from source
# (~8 min → ~30 s). install.sh always falls back to the source build when no
# matching asset exists, so this never breaks Law-0 reproducibility.
#
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read

jobs:
  quality:
    name: release quality gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  build:
    name: build ${{ matrix.target }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # a macOS failure must not block the Linux release
      matrix:
        include:
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-14,         target: aarch64-apple-darwin }
          # Intel-runner macos-13 was retired by GitHub (jobs queue forever,
          # the run hangs 24h then cancels) — cross-compile from arm64 instead.
          - { os: macos-14,         target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build omega (from this repo, pinned Cargo.lock)
        run: cargo build --release --locked --bin omega --target ${{ matrix.target }}

      - name: Resolve the pinned rmux rev
        id: rmux
        shell: bash
        run: |
          rev="$(grep -m1 'rmux-sdk' Cargo.toml | sed -E 's/.*rev *= *"([0-9a-f]+)".*/\1/')"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "rmux rev = $rev"

      - name: Build rmux (same rev omega links against)
        shell: bash
        run: |
          test -n "${{ steps.rmux.outputs.rev }}"
          git clone --filter=blob:none --no-checkout https://github.com/agentik-os/rmux /tmp/rmux
          git -C /tmp/rmux checkout --detach "${{ steps.rmux.outputs.rev }}"
          actual="$(git -C /tmp/rmux rev-parse HEAD)"
          case "$actual" in "${{ steps.rmux.outputs.rev }}"*) ;; *) echo "rmux revision mismatch" >&2; exit 1;; esac
          cargo build --release --manifest-path /tmp/rmux/Cargo.toml --target ${{ matrix.target }}

      - name: Package omega + rmux
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/omega" dist/omega
          cp "/tmp/rmux/target/${{ matrix.target }}/release/rmux" dist/rmux
          cargo_lock_sha="$(sha256sum Cargo.lock | awk '{print $1}')"
          printf '{"schema_version":1,"omega_commit":"%s","rmux_commit":"%s","cargo_lock_sha256":"%s","target":"%s"}\n' \
            "$GITHUB_SHA" "$(git -C /tmp/rmux rev-parse HEAD)" "$cargo_lock_sha" "${{ matrix.target }}" \
            > dist/BUILD-INFO.json
          cd dist
          tar czf "omega-${{ matrix.target }}.tar.gz" omega rmux BUILD-INFO.json
          ( command -v sha256sum >/dev/null 2>&1 && sha256sum "omega-${{ matrix.target }}.tar.gz" \
            || shasum -a 256 "omega-${{ matrix.target }}.tar.gz" ) > "omega-${{ matrix.target }}.tar.gz.sha256"
          ls -la

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/omega-${{ matrix.target }}.spdx.json
          artifact-name: omega-${{ matrix.target }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest archive provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/omega-${{ matrix.target }}.tar.gz

      - name: Attest archive SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/omega-${{ matrix.target }}.tar.gz
          sbom-path: dist/omega-${{ matrix.target }}.spdx.json

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/omega-${{ matrix.target }}.tar.gz
            dist/omega-${{ matrix.target }}.tar.gz.sha256
            dist/omega-${{ matrix.target }}.spdx.json
