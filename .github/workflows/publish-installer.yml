name: publish-installer

# Auto-publish the npx wrapper (installer/ -> npm omega-os) whenever its
# version bumps on main. Manual runs are also constrained to the canonical
# repository's main branch. Registry reads fail closed before any publish.
on:
  push:
    branches: [main]
    paths: ['installer/**']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-installer
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'agentik-os/OmegaOS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          registry-url: 'https://registry.npmjs.org'
      - name: Publish a strictly newer version
        working-directory: installer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node --check bin/omega-os.js
          npm test
          test "$(node -p "require('./package.json').name")" = "omega-os"
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view omega-os version)
          if node - "$LOCAL" "$PUBLISHED" <<'NODE'
          const [local, published] = process.argv.slice(2);
          const parse = (value) => {
            if (!/^\d+\.\d+\.\d+$/.test(value)) {
              throw new Error(`refusing non-stable SemVer: ${value}`);
            }
            return value.split('.').map(Number);
          };
          const left = parse(local);
          const right = parse(published);
          for (let i = 0; i < left.length; i += 1) {
            if (left[i] > right[i]) process.exit(0);
            if (left[i] < right[i]) process.exit(2);
          }
          process.exit(10);
          NODE
          then
            npm publish --access public --provenance
            echo "published omega-os@$LOCAL"
          else
            status=$?
            if [ "$status" -eq 10 ]; then
              echo "omega-os@$LOCAL already published; nothing to do"
              exit 0
            fi
            echo "refusing to publish omega-os@$LOCAL over newer $PUBLISHED" >&2
            exit "$status"
          fi
